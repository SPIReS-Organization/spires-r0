[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spires-r0"
version = "0.1.0"
description = "SPIReS background (R_0) reflectance production"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Niklas Griessbaum" }]
keywords = ["snow", "remote sensing", "xarray", "background reflectance"]
dependencies = [
    "spires-contract",
    "spires-io",
    "numpy",
    "xarray",
    "netCDF4",
    "rioxarray",
]

[project.optional-dependencies]
zarr = ["zarr<3"]
dask = ["dask"]
tqdm = ["tqdm"]
progress = ["tqdm"]
all = ["zarr<3", "dask", "tqdm"]
test = ["pytest", "zarr<3", "dask"]

[project.urls]
Homepage = "https://github.com/SPIReS-Organization/spires-r0"
Repository = "https://github.com/SPIReS-Organization/spires-r0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

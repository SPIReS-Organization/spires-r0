[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "spires-r0"
dynamic = ["version"]  # version derived from git tags via setuptools_scm
description = "SPIReS background (R_0) reflectance production"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Niklas Griessbaum" }]
keywords = ["snow", "remote sensing", "xarray", "background reflectance"]
dependencies = [
    "spires-contract @ git+https://github.com/SPIReS-Organization/spires-contract.git@v1.0.0",
    "spires-io @ git+https://github.com/SPIReS-Organization/spires-io.git@main",
    "numpy",
    "xarray",
    "netCDF4",
    "rioxarray",
]

[project.optional-dependencies]
zarr = ["zarr<3"]
dask = ["dask"]
tqdm = ["tqdm"]
progress = ["tqdm"]
all = ["zarr<3", "dask", "tqdm"]
test = ["pytest", "zarr<3", "dask"]

[project.urls]
Homepage = "https://github.com/SPIReS-Organization/spires-r0"
Repository = "https://github.com/SPIReS-Organization/spires-r0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "node-and-date"
